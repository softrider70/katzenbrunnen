<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katzenbrunnen</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#4ade80 0%,#22c55e 100%);margin:0;padding:10px}
.container{max-width:460px;margin:0 auto;background:white;padding:12px;border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,0.18)}
h1{color:#1f2937;margin:0;font-size:19px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:12px 0;border-bottom:2px solid #e5e7eb}
.tab-btn{min-width:0;padding:9px 6px;border:none;background:#eef2f7;cursor:pointer;font-weight:bold;border-radius:8px 8px 0 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab-btn.active{background:#22c55e;color:white}
.tab-content{display:none;padding:10px 0 0 0}
.tab-content.active{display:block}
.status-row{display:flex;justify-content:space-between;padding:8px;background:#f0f0f0;margin:5px 0;border-radius:4px;font-size:12px}
.buttons{display:flex;gap:8px;margin:10px 0 8px 0;flex-wrap:wrap}
button{flex:1;min-width:90px;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px}
.btn-primary{background:#22c55e;color:white}
.btn-danger{background:#ef4444;color:white}
.btn-secondary{background:#ddd}
.log-entry{padding:6px;background:#f9fafb;margin:4px 0;border-radius:4px;font-size:11px;border-left:3px solid #ccc}
.log-entry.severity-0{border-left-color:#3b82f6}
.log-entry.severity-1{border-left-color:#f59e0b}
.log-entry.severity-2{border-left-color:#ef4444}
.log-entry.severity-3{border-left-color:#7f1d1d}
.code-table{width:100%;border-collapse:collapse;font-size:11px}
.code-table th{background:#f3f4f6;padding:6px;text-align:left}
.code-table td{border-bottom:1px solid #e5e7eb;padding:6px}
.msg{padding:8px;margin:10px 0;border-radius:4px;font-size:11px;display:none}
.msg.error{background:#fee2e2;color:#991b1b}
.msg.success{background:#dcfce7;color:#166534}
</style>
</head>
<body>
<div class="container">
<h1>Katzenbrunnen</h1>
<div class="tabs">
<button class="tab-btn active" onclick="showTab('dashboard')">Dashboard</button>
<button class="tab-btn" onclick="showTab('logs')">Log-FIFO</button>
<button class="tab-btn" onclick="showTab('codes')">Fehlercodes</button>
<button class="tab-btn" onclick="showTab('wifi')">WiFi Setup</button>
</div>

<!-- DASHBOARD TAB -->
<div class="tab-content active" id="dashboard">
<div class="status-row"><span>Wasserhahn:</span><span id="valve-state">-</span></div>
<div class="status-row"><span>Bewegung:</span><span id="motion-state">-</span></div>
<div class="status-row"><span>Batterie:</span><span id="battery-state">-</span></div>
<div class="status-row"><span>WiFi:</span><span id="wifi-state">-</span></div>
<div class="status-row"><span>SSID:</span><span id="wifi-ssid">-</span></div>
<div class="status-row"><span>IP:</span><span id="wifi-ip">-</span></div>
<div class="buttons">
<button class="btn-primary" onclick="toggleValve()">Wasserhahn umschalten</button>
</div>
<div id="msg-dashboard" class="msg"></div>
</div>

<!-- LOG-FIFO TAB -->
<div class="tab-content" id="logs">
<p style="font-size:12px;margin:0 0 10px 0"><b>Fehler-Log (FIFO):</b></p>
<div id="log-container"></div>
<div class="buttons">
<button class="btn-danger" onclick="clearLogs()">Log leeren</button>
<button class="btn-secondary" onclick="loadLogs()">Aktualisieren</button>
</div>
<div id="msg-logs" class="msg"></div>
</div>

<!-- ERROR CODES TAB -->
<div class="tab-content" id="codes">
<p style="font-size:12px;margin:0 0 10px 0"><b>Fehlercode-Übersetzungstabelle:</b></p>
<table class="code-table">
<thead><tr><th>Code</th><th>Beschreibung</th></tr></thead>
<tbody id="code-table-body"></tbody>
</table>
<div class="buttons">
<button class="btn-secondary" onclick="loadCodes()">Aktualisieren</button>
</div>
<div id="msg-codes" class="msg"></div>
</div>

<!-- WIFI SETUP TAB -->
<div class="tab-content" id="wifi">
<p style="font-size:12px;margin:0 0 10px 0"><b>WiFi-Einrichtung:</b></p>
<div style="margin:10px 0">
<label style="font-size:12px;font-weight:bold">SSID:</label>
<input type="text" id="wifi-ssid-input" style="width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px;font-size:12px" placeholder="WiFi-SSID eingeben">
</div>
<div style="margin:10px 0">
<label style="font-size:12px;font-weight:bold">Passwort:</label>
<input type="password" id="wifi-pass-input" style="width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px;font-size:12px" placeholder="WiFi-Passwort eingeben">
</div>
<div class="buttons">
<button class="btn-primary" onclick="saveWifi()">Speichern & Verbinden</button>
<button class="btn-secondary" onclick="wifiReconnect()">Neu verbinden</button>
</div>
<p style="font-size:12px;margin:20px 0 10px 0;color:#ef4444"><b>Gefährliche Aktionen:</b></p>
<div class="buttons">
<button class="btn-danger" onclick="wifiReset()">WiFi-Reset</button>
<button class="btn-danger" onclick="systemReset()">System-Reset</button>
</div>
<div id="msg-wifi" class="msg"></div>
</div>

</div>

<script>
function showTab(tabId){
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
document.querySelector('.tab-btn[onclick="showTab(\''+tabId+'\')"]').classList.add('active');
document.getElementById(tabId).classList.add('active');
if(tabId==='dashboard')updateDashboard();
if(tabId==='logs')loadLogs();
if(tabId==='codes')loadCodes();
if(tabId==='wifi')loadWifiConfig();
}
function showMsg(tabId,text,isError){
const msgEl=document.getElementById('msg-'+tabId);
if(msgEl){
msgEl.textContent=text;
msgEl.className=isError?'msg error':'msg success';
msgEl.style.display='block';
setTimeout(()=>msgEl.style.display='none',3000);
}
}
function updateDashboard(){
fetch('/api/status').then(r=>r.json()).then(d=>{
document.getElementById('valve-state').textContent=d.valve_open?'GEÖFFNET':'GESCHLOSSEN';
document.getElementById('valve-state').style.color=d.valve_open?'#ef4444':'#22c55e';
document.getElementById('motion-state').textContent=d.motion_detected?'JA':'NEIN';
document.getElementById('motion-state').style.color=d.motion_detected?'#22c55e':'#6b7280';
document.getElementById('battery-state').textContent=d.battery_voltage.toFixed(2)+'V ('+d.battery_percent+'%)';
document.getElementById('battery-state').style.color=d.battery_percent<20?'#ef4444':'#166534';
document.getElementById('wifi-state').textContent=d.wifi_connected?'Verbunden':'Getrennt';
document.getElementById('wifi-state').style.color=d.wifi_connected?'#22c55e':'#ef4444';
document.getElementById('wifi-ssid').textContent=d.wifi_ssid;
document.getElementById('wifi-ip').textContent=d.wifi_ip;
}).catch(e=>console.error('updateDashboard failed:',e));
}
function toggleValve(){
fetch('/api/valve/toggle',{method:'POST'}).then(r=>r.json()).then(d=>{
showMsg('dashboard',d.message,false);
updateDashboard();
}).catch(e=>showMsg('dashboard','Fehler: '+e.message,true));
}
function loadLogs(){
fetch('/api/errors').then(r=>r.json()).then(d=>{
const container=document.getElementById('log-container');
container.innerHTML='';
if(d.errors&&d.errors.length>0){
d.errors.forEach(e=>{
const div=document.createElement('div');
div.className='log-entry severity-'+e.severity;
div.innerHTML='<b>'+e.code+'</b> - '+errText(e.id)+'<br><small>'+e.task+' | '+new Date(e.timestamp_ms).toLocaleString()+'</small>';
container.appendChild(div);
});
}else{
container.innerHTML='<p style="font-size:11px;color:#6b7280">Keine Fehler-Einträge</p>';
}
}).catch(e=>showMsg('logs','Fehler: '+e.message,true));
}
function clearLogs(){
if(!confirm('Fehler-Log wirklich leeren?'))return;
fetch('/api/errors/clear',{method:'POST'}).then(r=>r.json()).then(d=>{
showMsg('logs',d.message,false);
loadLogs();
}).catch(e=>showMsg('logs','Fehler: '+e.message,true));
}
function loadCodes(){
fetch('/api/error_codes').then(r=>r.json()).then(d=>{
const tbody=document.getElementById('code-table-body');
tbody.innerHTML='';
const codes=d.error_codes||{};
Object.keys(codes).forEach(code=>{
const tr=document.createElement('tr');
tr.innerHTML='<td><b>'+code+'</b></td><td>'+codes[code]+'</td>';
tbody.appendChild(tr);
});
}).catch(e=>showMsg('codes','Fehler: '+e.message,true));
}
function errText(id){
const map={'0x01':'Stack Overflow','0x02':'Watchdog Trigger','0x03':'Servo Failure','0x04':'Battery Critical','0x05':'PIR Failure','0x06':'ADC Failure','0x07':'NVS Failure','0x08':'WiFi Failure','0x09':'OTA Failure','0x0A':'Memory Allocation'};
return map['0x'+id.toString(16).padStart(2,'0').toUpperCase()]||'Unknown';
}
function loadWifiConfig(){
fetch('/api/status').then(r=>r.json()).then(d=>{
document.getElementById('wifi-ssid-input').value=d.wifi_ssid||'';
}).catch(e=>console.error('loadWifiConfig failed:',e));
}
function saveWifi(){
const ssid=document.getElementById('wifi-ssid-input').value.trim();
const pass=document.getElementById('wifi-pass-input').value;
if(!ssid){
showMsg('wifi','SSID darf nicht leer sein',true);
return;
}
const body=JSON.stringify({ssid:ssid,password:pass});
fetch('/api/wifi',{method:'POST',headers:{'Content-Type':'application/json'},body:body}).then(r=>r.json()).then(d=>{
showMsg('wifi',d.message,false);
if(d.status==='OK'){
setTimeout(()=>{location.reload();},2000);
}
}).catch(e=>showMsg('wifi','Fehler: '+e.message,true));
}
function wifiReconnect(){
fetch('/api/wifi/reconnect',{method:'POST'}).then(r=>r.json()).then(d=>{
showMsg('wifi',d.message,false);
}).catch(e=>showMsg('wifi','Fehler: '+e.message,true));
}
function wifiReset(){
showMsg('wifi','WiFi-Credentials werden gelöscht...',false);
fetch('/api/wifi/reset',{method:'POST'}).then(r=>r.json()).then(d=>{
showMsg('wifi',d.message,false);
if(d.status==='OK'){
setTimeout(()=>{location.reload();},2000);
}
}).catch(e=>showMsg('wifi','Fehler: '+e.message,true));
}
function systemReset(){
showMsg('wifi','System wird neu gestartet...',false);
fetch('/api/system/reset',{method:'POST'}).then(r=>r.json()).then(d=>{
showMsg('wifi',d.message,false);
if(d.status==='OK'){
setTimeout(()=>{location.reload();},2000);
}
}).catch(e=>showMsg('wifi','Fehler: '+e.message,true));
}
updateDashboard();
</script>
</body></html>
